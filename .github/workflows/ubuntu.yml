name: Free VPS Runner

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Essential Tools & EyeWitness Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y openssh-server curl wget git python3 python3-pip chromium-browser eyewitness

      - name: Setup SSH Password
        run: |
          echo "runner:Su@12345" | sudo chpasswd
          sudo service ssh start

      - name: Install & Run Bore Tunnel
        run: |
          wget https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz
          tar -xf bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz
          sudo mv bore /usr/local/bin/
          bore local 22 --to bore.pub &

      - name: Setup Web Terminal & Backup SSH (tmate)
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false

      - name: Keep Alive Loop
        run: |
          echo "VPS is running..."
          sleep 6 hours
