name: Free Ubuntu VPS (6 Hours)

on:
  workflow_dispatch:

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH + Tunnel
        run: |
          sudo apt-get update -y
          sudo apt-get install -y openssh-server

          # Enable SSH
          sudo systemctl enable ssh
          sudo systemctl start ssh

          # Password set
          echo "runner:Su@12345" | sudo chpasswd
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh

          # Start SSH tunnel using serveo (no card needed)
          ssh -o StrictHostKeyChecking=no -R 80:localhost:22 serveo.net &
          sleep 10

          echo "=============================================="
          echo "SSH INFO:"
          echo "Command: ssh -p 80 runner@serveo.net"
          echo "Username : runner"
          echo "Password : Su@12345"
          echo "=============================================="

          # Install tools
          sudo apt-get install -y nmap hydra sqlmap nikto john hashcat netcat-traditional whois dnsutils

      - name: Keep Alive (6 hours)
        run: sleep 6h
